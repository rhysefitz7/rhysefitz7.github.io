<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Coolness — Marine Life Tier List</title>
<style>
:root{
  --bg:#062b3a; --bg2:#0a4253; --glass:rgba(255,255,255,.11); --glass2:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.2); --text:#effcff; --muted:#b8dce5; --accent:#55e0df;
  --s:#ff7eaa; --a:#ffb45b; --b:#ffe26a; --c:#70e3a3; --d:#70b8ff; --f:#b6a1ff;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{background:
 radial-gradient(circle at 15% 10%,rgba(37,205,213,.26),transparent 28%),
 radial-gradient(circle at 90% 30%,rgba(0,157,203,.22),transparent 30%),
 linear-gradient(155deg,var(--bg),#031d2b 70%,#062c43); overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:linear-gradient(115deg,transparent 0 40%,rgba(255,255,255,.05) 42% 44%,transparent 46% 100%);animation:water 11s linear infinite}
@keyframes water{to{transform:translateX(8%) translateY(-2%)}}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubble{position:absolute;bottom:-50px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(255,255,255,.04);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--drift));opacity:0}}
.app{position:relative;z-index:1;max-width:1500px;margin:auto;padding:28px 22px 50px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}
h1{font-size:clamp(32px,5vw,62px);line-height:.95;margin:0 0 9px;letter-spacing:-.045em}
.subtitle{color:var(--muted);max-width:720px;font-size:15px;line-height:1.55}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,.search{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:14px;padding:10px 13px;font:inherit;cursor:pointer;backdrop-filter:blur(14px);transition:.2s}
button:hover{background:var(--glass2);transform:translateY(-1px)}
button.primary{background:rgba(85,224,223,.17);border-color:rgba(85,224,223,.45)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.search{display:flex;align-items:center;gap:8px;min-width:250px;flex:1}
.search input{border:0;outline:0;background:transparent;color:white;width:100%;font:inherit}
.search input::placeholder{color:#a8c9d2}
.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}
.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;font-size:12px}
.board{background:rgba(2,22,34,.38);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 25px 70px rgba(0,0,0,.22);backdrop-filter:blur(18px)}
.tier{display:grid;grid-template-columns:125px 1fr;min-height:112px;border:1px solid rgba(255,255,255,.12);border-radius:18px;overflow:hidden;margin:8px 0;background:rgba(255,255,255,.035)}
.tier-label{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:900;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.tier-label span{display:block;font-size:29px;letter-spacing:0}
.tier[data-tier=s] .tier-label{background:linear-gradient(145deg,var(--s),#ff527e)}
.tier[data-tier=a] .tier-label{background:linear-gradient(145deg,var(--a),#ff805a)}
.tier[data-tier=b] .tier-label{background:linear-gradient(145deg,var(--b),#e6b73c);color:#19303a}
.tier[data-tier=c] .tier-label{background:linear-gradient(145deg,var(--c),#31c88b);color:#07362d}
.tier[data-tier=d] .tier-label{background:linear-gradient(145deg,var(--d),#4c8cff)}
.tier[data-tier=f] .tier-label{background:linear-gradient(145deg,var(--f),#886be7)}
.tier-label input{display:none;background:transparent;border:0;border-bottom:2px solid currentColor;width:100%;text-align:center;color:inherit;font-weight:900}
.tier-content{display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;padding:9px;min-height:110px;transition:.15s}
.tier-content.over{background:rgba(85,224,223,.08);outline:2px dashed rgba(85,224,223,.4);outline-offset:-5px}
.tile{width:116px;height:122px;position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.2);background:#0a3545;cursor:grab;box-shadow:0 8px 18px rgba(0,0,0,.18);transition:.18s;user-select:none}
.tile:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 25px rgba(0,0,0,.3)}
.tile.dragging{opacity:.35;transform:rotate(2deg)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;background:linear-gradient(140deg,#0d5265,#082b3b)}
.tile:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.88))}
.tile-name{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;font-size:12px;font-weight:800;line-height:1.05;text-shadow:0 1px 6px #000}
.tile-tag{position:absolute;z-index:3;top:6px;right:6px;background:rgba(0,0,0,.48);backdrop-filter:blur(6px);border-radius:999px;padding:3px 6px;font-size:9px;color:#dffcff}
.bank{margin-top:18px}
.bank-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.bank-title h2{font-size:17px;margin:0}.count{color:var(--muted);font-size:12px}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:12px;min-height:180px;border:1px dashed rgba(255,255,255,.18);border-radius:18px;background:rgba(0,0,0,.12)}
.pool .tile{width:126px;height:130px}
.empty{width:100%;display:grid;place-items:center;color:#8fb7c1;min-height:130px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,10,18,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.card{width:min(720px,100%);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(9,57,72,.97),rgba(3,30,43,.97));overflow:hidden;box-shadow:0 30px 100px #0009}
.card-grid{display:grid;grid-template-columns:1fr 1fr}.card-img{min-height:310px;background:#073448}.card-img img{width:100%;height:100%;object-fit:cover}.card-body{padding:25px}.card-body h2{margin:0 0 7px;font-size:30px}.scientific{color:var(--accent);font-style:italic;font-size:13px;margin-bottom:17px}.facts{display:grid;gap:9px;color:#d7edf1;font-size:14px;line-height:1.4}.fact b{color:#8dcbd5}.close{position:absolute;right:22px;top:18px;border-radius:50%;width:40px;height:40px;padding:0}
.personality{margin-top:18px;padding:18px 20px;border:1px solid rgba(85,224,223,.25);background:linear-gradient(135deg,rgba(42,184,195,.12),rgba(255,255,255,.04));border-radius:20px;display:none}
.personality.show{display:block}.personality h3{margin:0 0 5px}.personality p{margin:0;color:#c5e1e6;line-height:1.5;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#062d3c;border:1px solid var(--line);padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){header{display:block}.actions{justify-content:flex-start;margin-top:15px}.tier{grid-template-columns:75px 1fr}.tier-label{font-size:11px}.tier-label span{font-size:24px}.tile{width:92px;height:104px}.pool .tile{width:100px;height:112px}.card-grid{grid-template-columns:1fr}.card-img{height:230px;min-height:0}}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="app">
<header>
<div>
<div class="eyebrow">Marine life • your rules</div>
<h1>How cool is that fish?</h1>
<div class="subtitle">Build your personal ocean hierarchy. Drag creatures into S through F, click any creature for facts, and discover what your choices say about your ocean personality.</div>
</div>
<div class="actions">
<button class="primary" id="personalityBtn">🧠 Ocean personality</button>
<button id="randomBtn">🎲 Randomize</button>
<button id="shuffleBtn">🔀 Shuffle</button>
<button id="saveBtn">💾 Save</button>
<button id="resetBtn">↺ Reset</button>
<button id="soundBtn">🌊 Ambience: off</button>
</div>
</header>

<div class="toolbar">
<label class="search">🔎 <input id="search" placeholder="Search creatures, e.g. shark, deep sea, whale…"></label>
<div class="chips" id="chips"></div>
</div>

<section class="board" id="board"></section>

<section class="bank">
<div class="bank-title"><h2>🐠 The ocean is waiting</h2><span class="count" id="count"></span></div>
<div class="pool" id="pool" data-zone="pool"></div>
</section>

<div class="personality" id="personality"></div>
</div>

<div class="modal" id="modal">
<button class="close" id="close">×</button>
<div class="card" id="card"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const creatures = [
["ocellaris clownfish","Clownfish","fish","Anemone-dwelling reef fish","Warm tropical Indo-Pacific","Amphiprion ocellaris"],
["mandarinfish","Mandarinfish","fish","Tiny psychedelic reef fish","Pacific coral reefs","Synchiropus splendidus"],
["lionfish","Red lionfish","fish","Venomous, fan-finned reef hunter","Indo-Pacific; invasive elsewhere","Pterois volitans"],
["moorish idol","Moorish idol","fish","Iconic long-finned reef fish","Tropical Indo-Pacific","Zanclus cornutus"],
["blue tang","Regal blue tang","fish","Bright surgeonfish with a sharp tail spine","Indo-Pacific reefs","Paracanthurus hepatus"],
["yellow tang","Yellow tang","fish","Sun-yellow reef grazer","Hawaiian and Pacific reefs","Zebrasoma flavescens"],
["butterflyfish","Copperband butterflyfish","fish","Long-snouted coral specialist","Indo-Pacific reefs","Chelmon rostratus"],
["wrasse","Humphead wrasse","fish","Massive reef wrasse with a bold face","Indo-Pacific coral reefs","Cheilinus undulatus"],
["parrotfish","Stoplight parrotfish","fish","Beak-jawed algae grazer","Western Atlantic reefs","Sparisoma viride"],
["seahorse","Lined seahorse","fish","Small fish with a prehensile tail","Atlantic and Caribbean","Hippocampus erectus"],
["leafy seadragon","Leafy seadragon","fish","Leaf-like camouflage master","Southern Australian waters","Phycodurus eques"],
["weedy seadragon","Weedy seadragon","fish","Camouflaged seadragon with drifting appendages","Southern Australia","Phyllopteryx taeniolatus"],
["porcupinefish","Porcupinefish","fish","Spiny fish that can inflate","Tropical and subtropical seas","Diodon holocanthus"],
["pufferfish","Pufferfish","fish","Inflatable defense specialist","Tropical and temperate seas","Tetraodontidae"],
["flying fish","Flying fish","fish","Gliding fish that launches above waves","Warm oceans worldwide","Exocoetidae"],
["sailfish","Sailfish","fish","Fast billfish with a huge dorsal sail","Tropical and temperate oceans","Istiophorus platypterus"],
["blue marlin","Blue marlin","fish","Powerful open-ocean billfish","Tropical and subtropical oceans","Makaira nigricans"],
["ocean sunfish","Ocean sunfish","fish","Enormous, bizarre-looking bony fish","Temperate and tropical oceans","Mola mola"],
["giant oceanic manta ray","Giant manta ray","ray","Largest ray with wing-like fins","Tropical and subtropical oceans","Mobula birostris"],
["spotted eagle ray","Spotted eagle ray","ray","Graceful ray covered in spots","Tropical coastal seas","Aetobatus narinari"],
["great hammerhead","Great hammerhead","shark","Hammer-shaped apex predator","Tropical and warm temperate seas","Sphyrna mokarran"],
["great white shark","Great white shark","shark","Iconic apex predator","Temperate coastal oceans","Carcharodon carcharias"],
["whale shark","Whale shark","shark","Gentle giant and largest fish","Tropical and warm oceans","Rhincodon typus"],
["tiger shark","Tiger shark","shark","Large, adaptable coastal predator","Tropical and warm temperate seas","Galeocerdo cuvier"],
["thresher shark","Common thresher shark","shark","Shark with an extraordinary tail","Temperate and tropical oceans","Alopias vulpinus"],
["lemon shark","Lemon shark","shark","Yellow-toned coastal shark","Tropical and subtropical waters","Negaprion brevirostris"],
["nurse shark","Nurse shark","shark","Bottom-resting reef shark","Tropical western Atlantic","Ginglymostoma cirratum"],
["green moray eel","Green moray eel","fish","Large reef eel with a dramatic grin","Tropical Atlantic reefs","Gymnothorax funebris"],
["wolf eel","Wolf eel","fish","Powerful-jawed Pacific reef fish","North Pacific rocky reefs","Anarrhichthys ocellatus"],
["giant grouper","Giant grouper","fish","Huge ambush predator of reefs","Indo-Pacific","Epinephelus lanceolatus"],
["giant trevally","Giant trevally","fish","Powerful reef predator","Indo-Pacific","Caranx ignobilis"],
["atlantic cod","Atlantic cod","fish","Classic cold-water commercial fish","North Atlantic","Gadus morhua"],
["bluefin tuna","Atlantic bluefin tuna","fish","Fast, warm-blooded open-ocean fish","North Atlantic and Mediterranean","Thunnus thynnus"],
["atlantic salmon","Atlantic salmon","fish","Famous migratory fish","North Atlantic and rivers","Salmo salar"],
["common goldfish","Goldfish","fish","Familiar freshwater classic","Freshwater worldwide in captivity","Carassius auratus"],
["koi","Koi","fish","Ornamental carp with endless color patterns","Freshwater ponds","Cyprinus rubrofuscus"],
["arapaima","Arapaima","fish","Ancient giant air-breathing river fish","Amazon Basin","Arapaima gigas"],
["electric eel","Electric eel","fish","Electric freshwater predator","South American rivers","Electrophorus electricus"],
["red-lipped batfish","Red-lipped batfish","fish","Bottom-walking fish with vivid lips","Galápagos and nearby Pacific","Ogcocephalus darwini"],
["blobfish","Blobfish","deep sea","Deep-sea fish famous for its unusual appearance","Deep waters off Australia and New Zealand","Psychrolutes marcidus"],
["anglerfish","Deep-sea anglerfish","deep sea","Bioluminescent lure-equipped predator","Deep ocean","Lophiiformes"],
["barreleye fish","Barreleye","deep sea","Transparent-headed deep-sea fish","Pacific deep waters","Macropinna microstoma"],
["gulper eel","Gulper eel","deep sea","Huge expandable mouth and tiny body","Deep ocean worldwide","Eurypharynx pelecanoides"],
["viperfish","Viperfish","deep sea","Fanged predator with bioluminescent organs","Deep ocean","Chauliodus sloani"],
["dragonfish","Black dragonfish","deep sea","Bioluminescent predator with needle teeth","Deep ocean","Idiacanthus atlanticus"],
["fangtooth fish","Fangtooth","deep sea","Small fish with enormous teeth","Deep ocean","Anoplogaster cornuta"],
["giant isopod","Giant isopod","deep sea","Armored deep-sea scavenger","Deep ocean floor","Bathynomus giganteus"],
["nautilus","Chambered nautilus","cephalopod","Ancient spiral-shelled cephalopod","Indo-Pacific reefs and slopes","Nautilus pompilius"],
["giant pacific octopus","Giant Pacific octopus","cephalopod","Largest octopus species","North Pacific","Enteroctopus dofleini"],
["cuttlefish","Common cuttlefish","cephalopod","Color-changing camouflage expert","European and Mediterranean waters","Sepia officinalis"],
["blue-ringed octopus","Blue-ringed octopus","cephalopod","Tiny octopus with vivid warning rings","Indo-Pacific tide pools","Hapalochlaena"],
["vampire squid","Vampire squid","cephalopod","Deep-sea cephalopod with cloak-like webbing","Oxygen-poor deep waters","Vampyroteuthis infernalis"],
["moon jelly","Moon jellyfish","jelly","Translucent jellyfish with four visible rings","Worldwide temperate seas","Aurelia aurita"],
["lion's mane jellyfish","Lion's mane jellyfish","jelly","Large jellyfish with long tentacles","Cold northern oceans","Cyanea capillata"],
["comb jelly","Sea walnut","jelly","Rainbow-iridescent comb jelly","Atlantic and Pacific coastal waters","Mnemiopsis leidyi"],
["blue whale","Blue whale","whale","Largest animal known to have lived","Oceans worldwide","Balaenoptera musculus"],
["humpback whale","Humpback whale","whale","Famous for songs and breaching","Oceans worldwide","Megaptera novaeangliae"],
["orca","Orca","whale","Highly social oceanic apex predator","Oceans worldwide","Orcinus orca"],
["narwhal","Narwhal","whale","Arctic whale with a long tusk","Arctic Ocean","Monodon monoceros"],
["beluga","Beluga whale","whale","White Arctic whale known for vocalizations","Arctic and sub-Arctic","Delphinapterus leucas"],
["sperm whale","Sperm whale","whale","Deep-diving toothed whale","Deep oceans worldwide","Physeter macrocephalus"],
["bottlenose dolphin","Bottlenose dolphin","dolphin","Familiar intelligent coastal dolphin","Tropical and temperate oceans","Tursiops truncatus"],
["spinner dolphin","Spinner dolphin","dolphin","Acrobatic dolphin known for spinning leaps","Tropical oceans","Stenella longirostris"],
["sea otter","Sea otter","mammal","Tool-using marine mammal and kelp-forest icon","North Pacific coastal waters","Enhydra lutris"],
["manatee","West Indian manatee","mammal","Gentle herbivorous aquatic mammal","Caribbean and Florida waters","Trichechus manatus"],
["green sea turtle","Green sea turtle","reptile","Long-lived marine turtle and seagrass grazer","Tropical and subtropical oceans","Chelonia mydas"],
["hawksbill turtle","Hawksbill turtle","reptile","Reef turtle with a distinctive beak","Tropical coral reefs","Eretmochelys imbricata"],
["giant clam","Giant clam","invertebrate","Massive colorful reef bivalve","Indo-Pacific coral reefs","Tridacna gigas"],
["mantis shrimp","Peacock mantis shrimp","crustacean","Colorful crustacean with lightning-fast strikes","Indo-Pacific reefs","Odontodactylus scyllarus"],
["coconut crab","Coconut crab","crustacean","Largest land-living arthropod","Indian and Pacific islands","Birgus latro"],
["horseshoe crab","Horseshoe crab","arthropod","Ancient marine arthropod","Atlantic coastal waters","Limulus polyphemus"]
];

const tierMeta={s:["S","LEGENDARY"],a:["A","ELITE"],b:["B","AWESOME"],c:["C","SOLID"],d:["D","MEH"],f:["F","NOPE"]};
const tierOrder=["s","a","b","c","d","f"];
const state={placements:{},filter:"all",query:"",images:{}};
const imgCacheKey="ocean-coolness-v1";
const saved=localStorage.getItem(imgCacheKey);
if(saved){try{state.placements=JSON.parse(saved)}catch{}}
const byId=Object.fromEntries(creatures.map(c=>[c[0],c]));

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function wikiTitle(name){return encodeURIComponent(name.replace(/\s+/g,"_"))}
async function loadImage(id,name){
  if(state.images[id]) return state.images[id];
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+wikiTitle(name));
    const j=await r.json();
    state.images[id]=j.thumbnail?.source || j.originalimage?.source || "";
  }catch(e){}
  return state.images[id]||"";
}
function fallbackSVG(name){
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e6073"/><stop offset="1" stop-color="#063045"/></linearGradient></defs><rect width="500" height="400 fill="url(#g)"/><text x="250" y="205" fill="#dffcff" font-family="Arial" font-size="25" text-anchor="middle">${esc(name)}</text><text x="250" y="240" fill="#91cbd4" font-family="Arial" font-size="15" text-anchor="middle">ocean creature</text></svg>`);
}
function filtered(){
 return creatures.filter(c=>(state.filter==="all"||c[2]===state.filter)&&(c[0]+" "+c[1]+" "+c[3]+" "+c[4]).toLowerCase().includes(state.query.toLowerCase()));
}
function makeTile(c){
 const [id,name,type,desc,habitat,scientific]=c;
 const tile=document.createElement("article"); tile.className="tile";tile.draggable=true;tile.dataset.id=id;tile.title="Click for details • drag to rank";
 const im=document.createElement("img"); im.alt=name;im.src=state.images[id]||fallbackSVG(name);
 const tag=document.createElement("div");tag.className="tile-tag";tag.textContent=type;
 const label=document.createElement("div");label.className="tile-name";label.textContent=name;
 tile.append(im,tag,label);
 tile.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",id);tile.classList.add("dragging")});
 tile.addEventListener("dragend",()=>tile.classList.remove("dragging"));
 tile.addEventListener("click",()=>openCard(c));
 return tile;
}
function render(){
 const board=document.getElementById("board"); board.innerHTML="";
 tierOrder.forEach(t=>{
   const row=document.createElement("div");row.className="tier";row.dataset.tier=t;
   const lab=document.createElement("div");lab.className="tier-label";lab.innerHTML=`<div><span>${tierMeta[t][0]}</span><small>${tierMeta[t][1]}</small></div>`;
   lab.title="Double-click to rename";
   lab.ondblclick=()=>renameTier(lab,t);
   const zone=document.createElement("div");zone.className="tier-content";zone.dataset.zone=t;
   zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over")});
   zone.addEventListener("dragleave",()=>zone.classList.remove("over"));
   zone.addEventListener("drop",e=>{e.preventDefault();zone.classList.remove("over");place(e.dataTransfer.getData("text/plain"),t,e.clientX,e.clientY,zone)});
   row.append(lab,zone);board.append(row);
   creatures.filter(c=>state.placements[c[0]]===t).forEach(c=>zone.append(makeTile(c)));
 });
 const pool=document.getElementById("pool");pool.innerHTML="";
 pool.addEventListener("dragover",e=>{e.preventDefault();pool.classList.add("over")});
 pool.addEventListener("dragleave",()=>pool.classList.remove("over"));
 pool.addEventListener("drop",e=>{e.preventDefault();pool.classList.remove("over");place(e.dataTransfer.getData("text/plain"),"pool")});
 const list=filtered().filter(c=>!state.placements[c[0]]);
 list.forEach(c=>pool.append(makeTile(c)));
 if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="No creatures match your search.";pool.append(e)}
 document.getElementById("count").textContent=`${list.length} unranked • ${creatures.length} total`;
 renderChips();
}
function place(id,t,x,y,zone){
 if(!id||!byId[id])return;
 state.placements[id]=t;
 if(t!=="pool" && zone){
   const tiles=[...zone.querySelectorAll(".tile")].filter(el=>el.dataset.id!==id);
   const before=tiles.find(el=>{const r=el.getBoundingClientRect();return y<r.top+r.height/2 || x<r.left+r.width/2});
   // state only stores tier; order is encoded separately below
 }
 save(false);render();
}
function save(show=true){localStorage.setItem(imgCacheKey,JSON.stringify(state.placements));if(show)toast("Ranking saved on this device 💾")}
function reset(){if(confirm("Reset every creature to the unranked pool?")){state.placements={};save(false);render();toast("Fresh ocean slate 🌊")}}
function shuffle(){const un=creatures.filter(c=>!state.placements[c[0]]);for(const c of un)state.placements[c[0]]=tierOrder[Math.floor(Math.random()*tierOrder.length)];save(false);render();toast("The ocean has spoken 🎲")}
function randomize(){const all=[...creatures];for(const c of all)state.placements[c[0]]=tierOrder[Math.floor(Math.random()*tierOrder.length)];save(false);render();toast("Everyone got a random rank 🎲")}
function renameTier(lab,t){const old=lab.querySelector("small").textContent;const val=prompt("Rename the "+tierMeta[t][0]+" tier:",old);if(val){lab.querySelector("small").textContent=val.toUpperCase();localStorage.setItem("ocean-tier-"+t,val)}}
function openCard(c){
 const [id,name,type,desc,habitat,scientific]=c;
 const card=document.getElementById("card");
 card.innerHTML=`<div class="card-grid"><div class="card-img"><img id="modalImg" src="${state.images[id]||fallbackSVG(name)}" alt="${esc(name)}"></div><div class="card-body"><div class="eyebrow">${esc(type)}</div><h2>${esc(name)}</h2><div class="scientific">${esc(scientific)}</div><div class="facts"><div class="fact"><b>Why it stands out:</b> ${esc(desc)}</div><div class="fact"><b>Where:</b> ${esc(habitat)}</div><div class="fact"><b>Your tier:</b> ${state.placements[id]?tierMeta[state.placements[id]][0]+" — "+tierMeta[state.placements[id]][1]:"Unranked"}</div></div></div></div>`;
 document.getElementById("modal").classList.add("show");
 loadImage(id,name).then(src=>{if(src)document.getElementById("modalImg").src=src});
}
function renderChips(){
 const chips=document.getElementById("chips");chips.innerHTML="";
 [["all","All"],["fish","Fish"],["shark","Sharks & rays"],["deep sea","Deep sea"],["whale","Whales"],["dolphin","Dolphins"],["cephalopod","Cephalopods"],["jelly","Jellies"],["mammal","Other mammals"],["reptile","Turtles"],["crustacean","Crustaceans"]].forEach(([v,l])=>{
   const b=document.createElement("button");b.className="chip";b.textContent=l;b.style.opacity=state.filter===v?"1":".62";b.onclick=()=>{state.filter=v;render()};chips.append(b)
 })
}
function personality(){
 const ranked=creatures.filter(c=>state.placements[c[0]]);
 if(!ranked.length){toast("Rank a few creatures first!");return}
 const counts={};ranked.forEach(c=>counts[c[2]]=(counts[c[2]]||0)+1);
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
 const s=ranked.filter(c=>state.placements[c[0]]==="s").map(c=>c[1]).slice(0,4);
 const names=s.length?s.join(", "):"a surprisingly unpredictable collection";
 const profiles={
 fish:["The Reef Connoisseur","You gravitate toward color, character, and creatures that look like they belong in a dream aquarium."],
 shark:["The Apex Enthusiast","You like presence. Your ocean is powered by bold silhouettes, predators, and creatures that command attention."],
 "deep sea":["The Abyss Explorer","You have a soft spot for weirdness. The stranger and harder to find, the better."],
 whale:["The Gentle Giant","You appreciate scale, intelligence, social behavior, and the cinematic side of the ocean."],
 dolphin:["The Acrobatic Ocean Fan","You seem drawn to clever, energetic, highly social marine life."],
 cephalopod:["The Eight-Armed Philosopher","Camouflage, intelligence, alien vibes — you clearly enjoy ocean creatures that refuse to be ordinary."],
 jelly:["The Drifting Dreamer","You like the hypnotic side of the sea: glowing, floating, translucent, and a little mysterious."],
 mammal:["The Coastal Companion","You have a soft spot for charismatic marine mammals and their unique relationships with coastal ecosystems."],
 reptile:["The Ancient Navigator","You appreciate marine life with deep evolutionary history and a timeless ocean presence."],
 crustacean:["The Tiny Tank Commander","Armor, claws, and attitude. You appreciate small creatures with disproportionately big personalities."]
 };
 const [title,text]=profiles[top]||["Ocean Wildcard","Your ranking refuses to fit neatly into one category — which is kind of the point."];
 const box=document.getElementById("personality");box.classList.add("show");
 box.innerHTML=`<h3>🌊 ${title}</h3><p>${text} Your S-tier currently includes <b>${esc(names)}</b>. Keep ranking to refine your ocean identity.</p>`;
 box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1900)}
document.getElementById("search").oninput=e=>{state.query=e.target.value;render()};
document.getElementById("saveBtn").onclick=()=>save(true);
document.getElementById("resetBtn").onclick=reset;
document.getElementById("shuffleBtn").onclick=shuffle;
document.getElementById("randomBtn").onclick=randomize;
document.getElementById("personalityBtn").onclick=personality;
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show")};

// Ambient ocean sound via Web Audio; starts only after a user click.
let audioCtx,master,noise;
document.getElementById("soundBtn").onclick=()=>{
 const b=document.getElementById("soundBtn");
 if(master){master.gain.value=0;master=null;b.textContent="🌊 Ambience: off";return}
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 master=audioCtx.createGain();master.gain.value=.035;master.connect(audioCtx.destination);
 const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.55;
 noise=audioCtx.createBufferSource();noise.buffer=buffer;noise.loop=true;
 const low=audioCtx.createBiquadFilter();low.type="lowpass";low.frequency.value=700;
 noise.connect(low).connect(master);noise.start();
 const lfo=audioCtx.createOscillator(),g=audioCtx.createGain();lfo.frequency.value=.08;g.gain.value=.025;lfo.connect(g).connect(master);lfo.start();
 b.textContent="🌊 Ambience: on";
 toast("Ocean ambience on — adjust your volume as needed");
};

for(let i=0;i<24;i++){const b=document.createElement("div");b.className="bubble";const s=5+Math.random()*18;b.style.width=s+"px";b.style.height=s+"px";b.style.left=Math.random()*100+"%";b.style.animationDuration=(8+Math.random()*13)+"s";b.style.animationDelay=(-Math.random()*18)+"s";b.style.setProperty("--drift",(Math.random()*120-60)+"px");document.getElementById("bubbles").append(b)}

async function hydrateImages(){
 for(const c of creatures){
   if(!state.images[c[0]]) loadImage(c[0],c[5]||c[1]).then(src=>{if(src){save(false);const tiles=document.querySelectorAll(`[data-id="${CSS.escape(c[0])}"] img`);tiles.forEach(i=>i.src=src)}})
 }
}
render();
hydrateImages();
